<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr Mario Next</title>
<style>
body{text-align:center;font-family:sans-serif;}
.wrap{display:flex;justify-content:center;gap:20px;}
canvas{background:#111;}
button{margin:5px;padding:10px;}
</style>
</head>
<body>

<h2>🧪 ドクターマリオ（ネクスト表示）</h2>

<div class="wrap">
  <canvas id="game" width="180" height="360"></canvas>
  <div>
    <p>Next</p>
    <canvas id="next" width="60" height="60"></canvas>
  </div>
</div>

<br>
<button onclick="move(-1)">←</button>
<button onclick="move(1)">→</button>
<button onclick="rotate()">回転</button>
<button onclick="drop()">↓</button>

<script>
const COLS=6,ROWS=12,SIZE=30;
const colors=["red","blue","yellow"];

let grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));

initVirus();

let piece=newPiece();
let nextPiece=newPiece(); // ★追加

function initVirus(){
  for(let i=0;i<10;i++){
    let x=Math.floor(Math.random()*COLS);
    let y=Math.floor(Math.random()*(ROWS/2))+ROWS/2;
    grid[y][x]={color:rand(),virus:true,link:null};
  }
}

function newPiece(){
  return {
    x:2,y:0,
    blocks:[
      {x:0,y:0,color:rand(),link:1},
      {x:0,y:1,color:rand(),link:0}
    ]
  }
}

function rand(){
  return colors[Math.floor(Math.random()*3)];
}

function draw(){
  const ctx=game.getContext("2d");
  ctx.clearRect(0,0,180,360);

  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      if(grid[y][x]){
        ctx.fillStyle=grid[y][x].color;
        ctx.fillRect(x*SIZE,y*SIZE,SIZE,SIZE);

        if(grid[y][x].virus){
          ctx.fillStyle="#fff";
          ctx.fillText("🦠",x*SIZE+5,y*SIZE+20);
        }
      }
    }
  }

  piece.blocks.forEach(b=>{
    ctx.fillStyle=b.color;
    ctx.fillRect((piece.x+b.x)*SIZE,(piece.y+b.y)*SIZE,SIZE,SIZE);
  });

  drawNext(); // ★追加
}

function drawNext(){
  const ctx=document.getElementById("next").getContext("2d");
  ctx.clearRect(0,0,60,60);

  nextPiece.blocks.forEach(b=>{
    ctx.fillStyle=b.color;
    ctx.fillRect((b.x+1)*20,(b.y+1)*20,20,20);
  });
}

function move(d){
  piece.x+=d;
  if(collision()) piece.x-=d;
}

function rotate(){
  piece.blocks=[piece.blocks[0],{x:1,y:0,color:piece.blocks[1].color,link:0}];
}

function drop(){
  piece.y++;
  if(collision()){
    piece.y--;
    lock();
    resolve();

    piece=nextPiece;        // ★ここ重要
    piece.x=2; piece.y=0;
    nextPiece=newPiece();   // ★次生成
  }
}

function collision(){
  return piece.blocks.some(b=>{
    let x=piece.x+b.x;
    let y=piece.y+b.y;
    return x<0||x>=COLS||y>=ROWS||(y>=0&&grid[y][x]);
  });
}

function lock(){
  piece.blocks.forEach(b=>{
    let x=piece.x+b.x;
    let y=piece.y+b.y;
    if(y>=0){
      grid[y][x]={color:b.color,link:b.link,virus:false};
    }
  });
}

function breakLinks(x,y){
  let cell=grid[y][x];
  if(!cell||cell.link===null) return;
  let ny=y+(cell.link===1?1:-1);
  if(grid[ny]&&grid[ny][x]) grid[ny][x].link=null;
  cell.link=null;
}

function resolve(){
  let changed=true;

  while(changed){
    changed=false;
    let remove=[];

    for(let y=0;y<ROWS;y++){
      for(let x=0;x<COLS;x++){
        let c=grid[y][x];
        if(!c) continue;

        if(x<COLS-3 &&
          c.color===grid[y][x+1]?.color &&
          c.color===grid[y][x+2]?.color &&
          c.color===grid[y][x+3]?.color){
          remove.push([x,y],[x+1,y],[x+2,y],[x+3,y]);
        }

        if(y<ROWS-3 &&
          c.color===grid[y+1]?.[x]?.color &&
          c.color===grid[y+2]?.[x]?.color &&
          c.color===grid[y+3]?.[x]?.color){
          remove.push([x,y],[x,y+1],[x,y+2],[x,y+3]);
        }
      }
    }

    if(remove.length>0){
      changed=true;

      remove.forEach(([x,y])=>{
        breakLinks(x,y);
        grid[y][x]=null;
      });

      gravity();
    }
  }
}

function gravity(){
  for(let x=0;x<COLS;x++){
    for(let y=ROWS-1;y>=0;y--){
      if(!grid[y][x]){
        for(let k=y-1;k>=0;k--){
          if(grid[k][x] && !grid[k][x].virus){
            grid[y][x]=grid[k][x];
            grid[k][x]=null;
            break;
          }
        }
      }
    }
  }
}

setInterval(()=>{
  drop();
  draw();
},1000);

draw();
</script>

</body>
</html>
