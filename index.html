<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr Mario Split Ver</title>
<style>
body{text-align:center;font-family:sans-serif;}
canvas{background:#111;margin-top:10px;}
button{margin:5px;padding:10px;}
</style>
</head>
<body>

<h2>🧪 ドクターマリオ（分断版）</h2>
<canvas id="game" width="180" height="360"></canvas><br>

<button onclick="move(-1)">←</button>
<button onclick="move(1)">→</button>
<button onclick="rotate()">回転</button>
<button onclick="drop()">↓</button>

<script>
const COLS=6,ROWS=12,SIZE=30;
const colors=["red","blue","yellow"];

let grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));

let piece=newPiece();

function newPiece(){
  return {
    x:2,y:0,
    blocks:[
      {x:0,y:0,color:rand(),link:1},
      {x:0,y:1,color:rand(),link:0}
    ]
  }
}

function rand(){
  return colors[Math.floor(Math.random()*3)];
}

function draw(){
  const ctx=game.getContext("2d");
  ctx.clearRect(0,0,180,360);

  // grid
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      if(grid[y][x]){
        ctx.fillStyle=grid[y][x].color;
        ctx.fillRect(x*SIZE,y*SIZE,SIZE,SIZE);
      }
    }
  }

  // piece
  piece.blocks.forEach((b,i)=>{
    ctx.fillStyle=b.color;
    ctx.fillRect((piece.x+b.x)*SIZE,(piece.y+b.y)*SIZE,SIZE,SIZE);
  });
}

function move(d){
  piece.x+=d;
  if(collision()) piece.x-=d;
}

function rotate(){
  piece.blocks=[piece.blocks[0],{x:1,y:0,color:piece.blocks[1].color,link:0}];
}

function drop(){
  piece.y++;
  if(collision()){
    piece.y--;
    lock();
    resolve();
    piece=newPiece();
  }
}

function collision(){
  return piece.blocks.some(b=>{
    let x=piece.x+b.x;
    let y=piece.y+b.y;
    return x<0||x>=COLS||y>=ROWS||(y>=0&&grid[y][x]);
  });
}

function lock(){
  piece.blocks.forEach((b,i)=>{
    let x=piece.x+b.x;
    let y=piece.y+b.y;
    if(y>=0){
      grid[y][x]={color:b.color,link:b.link};
    }
  });
}

// ★ここが核心：分断処理
function breakLinks(x,y){
  let cell=grid[y][x];
  if(!cell||cell.link===null) return;

  let nx=x+(cell.link===1?0:0);
  let ny=y+(cell.link===1?1:-1);

  if(grid[ny]&&grid[ny][nx]){
    grid[ny][nx].link=null;
  }
  cell.link=null;
}

// 消去＋分断
function resolve(){
  let changed=true;

  while(changed){
    changed=false;

    let remove=[];

    for(let y=0;y<ROWS;y++){
      for(let x=0;x<COLS;x++){
        let c=grid[y][x];
        if(!c) continue;

        // 横
        if(x<COLS-3 &&
          c.color===grid[y][x+1]?.color &&
          c.color===grid[y][x+2]?.color &&
          c.color===grid[y][x+3]?.color){
          remove.push([x,y],[x+1,y],[x+2,y],[x+3,y]);
        }

        // 縦
        if(y<ROWS-3 &&
          c.color===grid[y+1]?.[x]?.color &&
          c.color===grid[y+2]?.[x]?.color &&
          c.color===grid[y+3]?.[x]?.color){
          remove.push([x,y],[x,y+1],[x,y+2],[x,y+3]);
        }
      }
    }

    if(remove.length>0){
      changed=true;

      remove.forEach(([x,y])=>{
        breakLinks(x,y); // ←分断
        grid[y][x]=null;
      });

      gravity();
    }
  }
}

// 落下
function gravity(){
  for(let x=0;x<COLS;x++){
    for(let y=ROWS-1;y>=0;y--){
      if(!grid[y][x]){
        for(let k=y-1;k>=0;k--){
          if(grid[k][x]){
            grid[y][x]=grid[k][x];
            grid[k][x]=null;
            break;
          }
        }
      }
    }
  }
}

setInterval(()=>{
  drop();
  draw();
},500);

draw();
</script>

</body>
</html>
