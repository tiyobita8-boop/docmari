<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr Mario Final</title>
<style>
body{text-align:center;font-family:sans-serif;}
.wrap{display:flex;justify-content:center;gap:20px;}
canvas{background:#111;}
button{margin:5px;padding:10px;}
</style>
</head>
<body>

<h2>🧪 ドクターマリオ完成版</h2>

<div class="wrap">
  <canvas id="game" width="180" height="360"></canvas>
  <div>
    <p>Next</p>
    <canvas id="next" width="60" height="60"></canvas>
  </div>
</div>

<br>
<button onclick="move(-1)">←</button>
<button onclick="move(1)">→</button>
<button onclick="rotate()">回転</button>
<button onclick="drop()">↓</button>

<script>
const COLS=6,ROWS=12,SIZE=30;
const colors=["red","blue","yellow"];

let grid, piece, nextPiece;
let virusCount=0;
let gameActive=true;

initGame();

function initGame(){
  grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  initVirus();
  piece=newPiece();
  nextPiece=newPiece();
}

function initVirus(){
  virusCount=0;
  for(let i=0;i<10;i++){
    let x=Math.floor(Math.random()*COLS);
    let y=Math.floor(Math.random()*(ROWS/2))+ROWS/2;
    if(!grid[y][x]){
      grid[y][x]={color:rand(),virus:true,link:null};
      virusCount++;
    }
  }
}

function newPiece(){
  return {
    x:2,y:0,rot:0,
    colors:[rand(),rand()]
  }
}

function rand(){
  return colors[Math.floor(Math.random()*3)];
}

function getBlocks(p){
  if(p.rot===0) return [{x:0,y:0},{x:0,y:1}];
  if(p.rot===1) return [{x:0,y:0},{x:1,y:0}];
  if(p.rot===2) return [{x:0,y:0},{x:0,y:-1}];
  return [{x:0,y:0},{x:-1,y:0}];
}

function draw(){
  const ctx=game.getContext("2d");
  ctx.clearRect(0,0,180,360);

  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      if(grid[y][x]){
        ctx.fillStyle=grid[y][x].color;
        ctx.fillRect(x*SIZE,y*SIZE,SIZE,SIZE);
        if(grid[y][x].virus){
          ctx.fillStyle="#fff";
          ctx.fillText("🦠",x*SIZE+5,y*SIZE+20);
        }
      }
    }
  }

  getBlocks(piece).forEach((b,i)=>{
    ctx.fillStyle=piece.colors[i];
    ctx.fillRect((piece.x+b.x)*SIZE,(piece.y+b.y)*SIZE,SIZE,SIZE);
  });

  drawNext();
}

function drawNext(){
  const ctx=next.getContext("2d");
  ctx.clearRect(0,0,60,60);

  getBlocks(nextPiece).forEach((b,i)=>{
    ctx.fillStyle=nextPiece.colors[i];
    ctx.fillRect((b.x+1)*20,(b.y+1)*20,20,20);
  });
}

function move(d){
  piece.x+=d;
  if(collision()) piece.x-=d;
}

function rotate(){
  let old=piece.rot;
  piece.rot=(piece.rot+1)%4;

  if(collision()){
    piece.x++; // 壁キック簡易
    if(collision()){
      piece.x--;
      piece.rot=old;
    }
  }
}

function drop(){
  if(!gameActive) return;

  piece.y++;
  if(collision()){
    piece.y--;
    lock();
    resolve();

    piece=nextPiece;
    piece.x=2; piece.y=0;
    nextPiece=newPiece();
  }
}

function collision(){
  return getBlocks(piece).some((b,i)=>{
    let x=piece.x+b.x;
    let y=piece.y+b.y;
    return x<0||x>=COLS||y>=ROWS||(y>=0&&grid[y][x]);
  });
}

function lock(){
  getBlocks(piece).forEach((b,i)=>{
    let x=piece.x+b.x;
    let y=piece.y+b.y;
    if(y>=0){
      grid[y][x]={color:piece.colors[i],virus:false};
    }
  });
}

function resolve(){
  let changed=true;

  while(changed){
    changed=false;
    let remove=[];

    for(let y=0;y<ROWS;y++){
      for(let x=0;x<COLS;x++){
        let c=grid[y][x];
        if(!c) continue;

        if(x<COLS-3 &&
          c.color===grid[y][x+1]?.color &&
          c.color===grid[y][x+2]?.color &&
          c.color===grid[y][x+3]?.color){
          remove.push([x,y],[x+1,y],[x+2,y],[x+3,y]);
        }

        if(y<ROWS-3 &&
          c.color===grid[y+1]?.[x]?.color &&
          c.color===grid[y+2]?.[x]?.color &&
          c.color===grid[y+3]?.[x]?.color){
          remove.push([x,y],[x,y+1],[x,y+2],[x,y+3]);
        }
      }
    }

    if(remove.length>0){
      changed=true;

      remove.forEach(([x,y])=>{
        if(grid[y][x]?.virus) virusCount--;
        grid[y][x]=null;
      });

      gravity();
    }
  }

  if(virusCount===0){
    gameClear();
  }
}

function gravity(){
  for(let x=0;x<COLS;x++){
    for(let y=ROWS-1;y>=0;y--){
      if(!grid[y][x]){
        for(let k=y-1;k>=0;k--){
          if(grid[k][x] && !grid[k][x].virus){
            grid[y][x]=grid[k][x];
            grid[k][x]=null;
            break;
          }
        }
      }
    }
  }
}

function gameClear(){
  gameActive=false;
  const ctx=game.getContext("2d");
  ctx.fillStyle="white";
  ctx.font="20px sans-serif";
  ctx.fillText("CLEAR!",40,180);

  setTimeout(()=>{
    initGame();
    gameActive=true;
  },2000);
}

// ★速度さらに半分（2秒）
setInterval(()=>{
  drop();
  draw();
},2000);

draw();
</script>

</body>
</html>
