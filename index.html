<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr Mario Mini</title>
<style>
body { text-align:center; font-family:sans-serif; }
canvas { background:#111; margin-top:10px; }
button { margin:5px; padding:10px; }
</style>
</head>
<body>

<h2>🧪 Dr Mario Mini</h2>
<canvas id="game" width="180" height="360"></canvas><br>

<button onclick="move(-1)">←</button>
<button onclick="move(1)">→</button>
<button onclick="rotate()">回転</button>
<button onclick="drop()">↓</button>

<script>
const COLS = 6;
const ROWS = 12;
const SIZE = 30;

const colors = ["red","blue","yellow"];

let grid = Array.from({length:ROWS},()=>Array(COLS).fill(null));

let piece = newPiece();

function newPiece(){
  return {
    x:2,
    y:0,
    blocks:[
      {x:0,y:0,color:rand()},
      {x:0,y:1,color:rand()}
    ]
  }
}

function rand(){
  return colors[Math.floor(Math.random()*colors.length)];
}

function draw(){
  const ctx = document.getElementById("game").getContext("2d");
  ctx.clearRect(0,0,180,360);

  // grid
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      if(grid[y][x]){
        ctx.fillStyle = grid[y][x];
        ctx.fillRect(x*SIZE,y*SIZE,SIZE,SIZE);
      }
    }
  }

  // piece
  piece.blocks.forEach(b=>{
    ctx.fillStyle = b.color;
    ctx.fillRect((piece.x+b.x)*SIZE,(piece.y+b.y)*SIZE,SIZE,SIZE);
  });
}

function move(dir){
  piece.x += dir;
}

function rotate(){
  piece.blocks = [
    piece.blocks[0],
    {x:1,y:0,color:piece.blocks[1].color}
  ];
}

function drop(){
  piece.y++;
  if(collision()){
    piece.y--;
    lock();
    clearMatch();
    piece = newPiece();
  }
}

function collision(){
  return piece.blocks.some(b=>{
    let x = piece.x + b.x;
    let y = piece.y + b.y;
    return y>=ROWS || x<0 || x>=COLS || (y>=0 && grid[y][x]);
  });
}

function lock(){
  piece.blocks.forEach(b=>{
    let x = piece.x + b.x;
    let y = piece.y + b.y;
    if(y>=0) grid[y][x]=b.color;
  });
}

function clearMatch(){
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      let c = grid[y][x];
      if(!c) continue;

      // 横チェック
      if(x< COLS-3 &&
         c===grid[y][x+1] &&
         c===grid[y][x+2] &&
         c===grid[y][x+3]){
           grid[y][x]=grid[y][x+1]=grid[y][x+2]=grid[y][x+3]=null;
      }

      // 縦チェック
      if(y< ROWS-3 &&
         c===grid[y+1][x] &&
         c===grid[y+2][x] &&
         c===grid[y+3][x]){
           grid[y][x]=grid[y+1][x]=grid[y+2][x]=grid[y+3][x]=null;
      }
    }
  }

  // 落下
  for(let x=0;x<COLS;x++){
    for(let y=ROWS-1;y>=0;y--){
      if(!grid[y][x]){
        for(let k=y-1;k>=0;k--){
          if(grid[k][x]){
            grid[y][x]=grid[k][x];
            grid[k][x]=null;
            break;
          }
        }
      }
    }
  }
}

setInterval(()=>{
  drop();
  draw();
},500);

draw();
</script>

</body>
</html>
